!
! AF31 ingress marking — the policy this lab's stream test exercises.
!
! Applied on the perimeter router's LAN-facing interface, so traffic from the
! customer application subnets is marked AF31 as it enters, before heading to
! the WAN. qosgen sends the traffic unmarked (DSCP 0) on purpose: every marking
! seen downstream was applied here, not by the generator.
!
! The port operator sits between the source and the destination, so these match
! SOURCE ports — the applications are the talkers, replying to users. Written as
! 'any eq 80' instead, they would match destination port 80, which is the
! opposite direction and matches none of the test traffic.
!
! Six customer /25s x five application ports = 30 lines, mirroring the SOURCES
! and APPS arrays in customer-streams.sh. Keep the two in step.
!
ip access-list extended AF31_SWAN2_MARKING
 remark SAS National Applications - source ports, DC to user
 10 permit tcp 10.248.76.0 0.0.0.127 eq 80 any
 20 permit tcp 10.248.76.0 0.0.0.127 eq 443 any
 30 permit tcp 10.248.76.0 0.0.0.127 eq 8443 any
 40 permit tcp 10.248.76.0 0.0.0.127 eq 3389 any
 50 permit udp 10.248.76.0 0.0.0.127 eq 3389 any
 60 permit tcp 10.248.76.128 0.0.0.127 eq 80 any
 70 permit tcp 10.248.76.128 0.0.0.127 eq 443 any
 80 permit tcp 10.248.76.128 0.0.0.127 eq 8443 any
 90 permit tcp 10.248.76.128 0.0.0.127 eq 3389 any
 100 permit udp 10.248.76.128 0.0.0.127 eq 3389 any
 110 permit tcp 10.248.77.128 0.0.0.127 eq 80 any
 120 permit tcp 10.248.77.128 0.0.0.127 eq 443 any
 130 permit tcp 10.248.77.128 0.0.0.127 eq 8443 any
 140 permit tcp 10.248.77.128 0.0.0.127 eq 3389 any
 150 permit udp 10.248.77.128 0.0.0.127 eq 3389 any
 160 permit tcp 10.248.82.0 0.0.0.127 eq 80 any
 170 permit tcp 10.248.82.0 0.0.0.127 eq 443 any
 180 permit tcp 10.248.82.0 0.0.0.127 eq 8443 any
 190 permit tcp 10.248.82.0 0.0.0.127 eq 3389 any
 200 permit udp 10.248.82.0 0.0.0.127 eq 3389 any
 210 permit tcp 10.248.82.128 0.0.0.127 eq 80 any
 220 permit tcp 10.248.82.128 0.0.0.127 eq 443 any
 230 permit tcp 10.248.82.128 0.0.0.127 eq 8443 any
 240 permit tcp 10.248.82.128 0.0.0.127 eq 3389 any
 250 permit udp 10.248.82.128 0.0.0.127 eq 3389 any
 260 permit tcp 10.248.83.128 0.0.0.127 eq 80 any
 270 permit tcp 10.248.83.128 0.0.0.127 eq 443 any
 280 permit tcp 10.248.83.128 0.0.0.127 eq 8443 any
 290 permit tcp 10.248.83.128 0.0.0.127 eq 3389 any
 300 permit udp 10.248.83.128 0.0.0.127 eq 3389 any
!
class-map match-any AF31_SWAN2_INBOUND
 match access-group name AF31_SWAN2_MARKING
!
policy-map MARK_IN
 description Mark SAS National Applications as AF31
 class AF31_SWAN2_INBOUND
  set dscp af31
!
! Must be the interface the traffic ENTERS by. An input policy on the wrong
! interface matches nothing and looks identical to a broken ACL.
!
interface GigabitEthernet0/5
 service-policy input MARK_IN
!
! Verify, once traffic is flowing:
!   show ip access-lists AF31_SWAN2_MARKING          ! per-line match counts
!   show policy-map interface GigabitEthernet0/5 input
!
